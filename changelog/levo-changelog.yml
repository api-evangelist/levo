  highlights:
  - This release connects multiple GitHub accounts to one organization, brings AI‑assisted triage to bulk vulnerability selections, and adds an
    authentication‑bypass test for gateway path handling.
  - Endpoint trace listings load quickly on large workspaces, AI‑driven crawls spend their budget on real pages instead of filter variants, and
    AI‑guided login now proves it actually signed in before a scan continues.
  date: '2026-10-13'
- breaking: false
  highlights:
  - This release is about trusting what you see.
  - Duplicate API endpoints can now be merged in bulk, TLS findings from the Satellite are reported again after being silently absent, and scan
    results no longer render a vulnerable or unrecognised scan as clean.
  - Custom AI‑authored tests gain a full authoring lifecycle — create, validate, approve — with every run bound to the exact code a human reviewed.
  date: '2026-10-06'
- breaking: true
  highlights:
  - This release connects Levo to WSO2 API Gateway with a one‑click push of endpoints, gives the Service Graph its own full‑screen page, and adds
    AI‑assisted triage from the vulnerability view.
  - 'Security testing results are markedly more trustworthy: tests that could not run are reported as skipped rather than failed, several classes
    of false positives are gone, and injection tests once again reach the endpoints they target.'
  - DAST scans gain second‑factor support, PDF reports get a redesign, and sign‑in, SSO and administration are more reliable across identity providers.
  date: '2026-09-22'
